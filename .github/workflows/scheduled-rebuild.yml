name: Scheduled site rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Trigger GitHub Pages rebuild
        run: |
          git config user.name "gigwire bot"
          git config user.email "144622160+SwayamKontamwar@users.noreply.github.com"
          git commit --allow-empty -m "Scheduled site rebuild"
          git push origin HEAD:main
